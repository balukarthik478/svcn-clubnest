<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SVCN ClubNest</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=Bagel+Fat+One&display=swap" rel="stylesheet">
<style>
:root{--ease:cubic-bezier(.22,.8,.3,1);--a:#7c5cff;--b:#22d3ee;--bg1:#0b1026;--bg2:#1b1450;--ink:#fff;--soft:rgba(255,255,255,.14);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{font-family:'Sora',system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg1));background-size:300% 300%;animation:flow 45s ease-in-out infinite;min-height:100vh;overflow-x:hidden;transition:background .6s}
@keyframes flow{50%{background-position:100% 100%}}
a,button{font:inherit;color:inherit;text-decoration:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.drop{position:fixed;border-radius:50%;opacity:.13;pointer-events:none;z-index:0;filter:blur(1px);animation:bob 20s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.page{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:28px 18px 0;animation:pg .6s var(--ease)}
@keyframes pg{from{opacity:0;transform:translateY(8px)}}
.glass{background:linear-gradient(145deg,rgba(255,255,255,.22),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 30px rgba(0,0,0,.25);border-radius:26px;transition:transform .45s var(--ease),box-shadow .3s}
.tap:hover{transform:scale(1.015)}.tap:active{transform:scale(.97)}
.hero{text-align:center;padding:26px 0 10px}
.logo{width:150px;height:150px;animation:float 10s ease-in-out infinite;filter:drop-shadow(0 18px 24px rgba(0,0,0,.45))}
@keyframes float{50%{transform:translateY(-6px)}}
h1{font-family:'Bagel Fat One','Sora',sans-serif;font-weight:400;font-size:clamp(40px,11vw,78px);letter-spacing:1px;margin-top:10px;color:#fff;-webkit-text-stroke:2px #2b7de9;paint-order:stroke fill;text-shadow:0 3px 0 #6cb8ff,0 6px 0 #3f8ef0,0 9px 0 #2b6fd0,0 18px 24px rgba(43,125,233,.35)}
h1 span{display:inline-block;animation:wave 5s ease-in-out infinite}
@keyframes wave{50%{transform:translateY(-4px)}}
@keyframes shine{to{background-position:200%}}
.tag{opacity:.8;margin:8px 0 22px}
.btn{display:inline-block;padding:14px 30px;font-weight:600}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:30px 0}
.pics img{width:100%;height:100%;object-fit:cover;border-radius:22px;display:block;aspect-ratio:4/3}
.pics div{padding:6px;overflow:hidden}
h2{font-size:26px;margin:14px 0 4px}
.sub{opacity:.75;margin-bottom:16px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{padding:20px;text-align:left;display:block;width:100%}
.card .em{font-size:34px}.card b{display:block;margin:8px 0 4px;font-size:17px}.card span{font-size:13px;opacity:.8}
.back{display:inline-block;padding:9px 18px;margin-bottom:12px;font-size:14px}
.list .card{display:flex;justify-content:space-between;align-items:center;gap:10px}
.go{white-space:nowrap;padding:8px 16px;border-radius:99px;background:var(--a);font-size:13px;font-weight:600}
form{padding:22px;display:grid;gap:12px;margin-top:10px}
label{font-size:13px;opacity:.85;display:grid;gap:5px}
input,select{padding:13px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;font:inherit;outline:none;transition:.25s}
input:focus,select:focus{border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.18)}
select option{color:#000}
.ok{text-align:center;padding:36px 20px;animation:pg .6s var(--ease)}
.ok .em{font-size:60px;display:block;animation:pop .7s var(--ease)}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.bar{height:12px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b));border-radius:9px;transition:width 1s var(--ease)}
.row{padding:14px 18px;margin-bottom:10px}
footer{position:relative;z-index:1;text-align:center;padding:40px 18px 34px;margin-top:40px}
footer img{width:64px;height:64px;animation:float 12s ease-in-out infinite}
footer b{display:block;margin-top:8px;font-size:17px}footer small{display:block;font-size:11px;opacity:.7;margin-top:4px}
.home{--bg1:#bfe6ff;--bg2:#e8f7ff;--a:#2b7de9;--b:#00b4d8;--ink:#0b2a55}
.date,.go{color:#fff}
.home input,.home select{color:#0b2a55;background:rgba(255,255,255,.75);border-color:rgba(43,125,233,.4)}
.home .glass{background:linear-gradient(145deg,rgba(255,255,255,.8),rgba(255,255,255,.45));border-color:rgba(255,255,255,.95);box-shadow:inset 0 1px 0 #fff,0 10px 30px rgba(43,125,233,.18)}
.home .slot{border-color:rgba(43,125,233,.5);background:rgba(255,255,255,.35);box-shadow:none}
.home .chips i{background:rgba(43,125,233,.12)}
.home .sheet{background:linear-gradient(145deg,rgba(40,32,80,.96),rgba(18,14,38,.96));border-color:rgba(255,255,255,.28)}
.home .sheet .chips i{background:rgba(255,255,255,.14)}
.home .idcard input{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.4)}
.clubs{--bg1:#2b0f3a;--bg2:#0e4a5a;--a:#ff7ab6;--b:#ffd36b}
.sec{margin:44px 0 4px;font-size:28px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:8px 0}
.stats div{padding:18px 8px;text-align:center;animation:rise .6s var(--ease) both}.stats b{display:block;font-size:30px}.stats span{font-size:12px;opacity:.75}
.evs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.evc{padding:20px;text-align:left;display:block;width:100%;min-height:150px;animation:rise .6s var(--ease) both}
.evc b{display:block;margin:10px 0 4px;font-size:18px}.evc span.t{font-size:13px;opacity:.8}
.slot{border:1.5px dashed rgba(255,255,255,.4);box-shadow:none;background:rgba(255,255,255,.05);cursor:default;display:grid;place-content:center;text-align:center}
.date{display:inline-block;padding:5px 12px;border-radius:99px;background:var(--a);font-size:12px;font-weight:600}
.cd{padding:18px;text-align:left;display:flex;gap:14px;align-items:flex-start;width:100%;animation:rise .6s var(--ease) both}
.cd b{display:block;margin-bottom:4px}.cd span.t{font-size:13px;opacity:.82;line-height:1.5}
.ic{font-size:32px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chips i{font-style:normal;font-size:11px;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.14)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}.steps div{padding:20px}.steps b{display:block;margin:6px 0 4px}.steps span{font-size:13px;opacity:.8}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:18px;animation:fade .3s ease}
.sheet{color:#fff;width:min(520px,100%);max-height:90vh;overflow:auto;animation:up .45s var(--ease);background:linear-gradient(145deg,rgba(40,32,80,.94),rgba(18,14,38,.94))}
.stage{height:170px;position:relative;overflow:hidden}
.fl{position:absolute;animation:drift 7s ease-in-out infinite}
.body{padding:20px}.t2{font-size:14px;line-height:1.6;opacity:.9}
@keyframes fade{from{opacity:0}}@keyframes up{from{opacity:0;transform:translateY(24px) scale(.98)}}@keyframes drift{50%{transform:translateY(-12px) rotate(6deg)}}
.modal.out{animation:fadeout .26s ease forwards}.modal.out .sheet{animation:down .26s ease forwards}
@keyframes fadeout{to{opacity:0}}@keyframes down{to{opacity:0;transform:translateY(16px) scale(.97)}}@keyframes pin{from{opacity:0;transform:scale(.92)}}
.stage{animation:pin .6s var(--ease) both}
.cd .ic{transition:transform .5s var(--ease)}.cd:hover .ic{transform:scale(1.12) rotate(-6deg)}.cd:active .ic{transform:scale(.9)}
.idcard{margin-top:18px;border-radius:26px;overflow:hidden;color:#fff;background:linear-gradient(135deg,#0b2a55,#1e4fa8 55%,#00b4d8);box-shadow:0 18px 40px rgba(11,42,85,.35);padding:0 20px 20px;display:grid;gap:14px;position:relative;animation:rise .6s var(--ease) both}
.idcard::after{content:'';position:absolute;top:12px;left:50%;width:46px;height:8px;margin-left:-23px;border-radius:9px;background:rgba(255,255,255,.35)}
.strip{display:flex;align-items:center;gap:10px;padding:32px 0 12px;border-bottom:1px dashed rgba(255,255,255,.35);font-size:12px;letter-spacing:.2em;font-weight:600}.strip img{width:34px;height:34px}
.idcard label{color:#d7ecff}.idbtn{background:#fff;color:#0b2a55;border-radius:99px;font-weight:700}
.idcard .who{display:flex;align-items:center;gap:14px}.av{width:54px;height:54px;border-radius:50%;background:#fff;color:#0b2a55;display:grid;place-items:center;font-size:24px;font-style:normal;font-weight:800}.who b{display:block;font-size:18px}.who span{font-size:13px;opacity:.85}
.go.out{justify-self:start;background:rgba(255,255,255,.2)}
.go.ph{display:inline-block;cursor:pointer;opacity:1}
.evimg{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:16px;margin-bottom:10px;display:block}
.logins{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;align-items:start}
.idcard.coord{border-radius:14px;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 10px,transparent 10px 20px),linear-gradient(135deg,#3a1606,#b4400a 60%,#f59e0b);box-shadow:0 18px 40px rgba(122,42,5,.35)}
.coord label{color:#ffe9c7}.coord .idbtn{color:#7a2a05}
.idcard.outer{background:linear-gradient(135deg,#064e3b,#0f9d75 60%,#6ee7b7);box-shadow:0 18px 40px rgba(6,78,59,.3);margin-top:14px}.outer label{color:#d6fff0}.outer .idbtn{color:#064e3b}
.idcard.adm{background:linear-gradient(135deg,#1e1b4b,#4c1d95 60%,#a78bfa);box-shadow:0 18px 40px rgba(76,29,149,.3)}.adm label{color:#e9ddff}.adm .idbtn{color:#3b1a7a}
.cta{text-align:center;padding:34px 18px;margin-top:40px}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:560px){.pics{grid-template-columns:1fr}}
</style></head><body>
